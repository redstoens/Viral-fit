<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Viral-fit</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <header>
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">Viral<b>-fit</b></span>
    </div>
    <span class="version-badge" id="versionBadge">v1.0</span>
  </header>

  <!-- 탭 -->
  <nav class="tabs">
    <button class="tab active" data-tab="collect">수집</button>
    <button class="tab" data-tab="generate">AI 생성</button>
    <button class="tab" data-tab="queue">발행 큐</button>
    <button class="tab" data-tab="settings">설정</button>
  </nav>

  <!-- ── 수집 탭 ── -->
  <section class="panel active" id="tab-collect">

    <!-- 설정 행 -->
    <div class="config-row">
      <div class="config-item">
        <label>최소 조회수</label>
        <input type="number" id="minViews" value="10000" min="1000" step="1000" />
      </div>
      <div class="config-item">
        <label>목표 수량</label>
        <input type="number" id="targetCount" value="20" min="1" max="200" />
      </div>
      <div class="config-item">
        <label>딜레이(ms)</label>
        <input type="number" id="delay" value="2000" min="1000" step="500" />
      </div>
    </div>

    <!-- 버튼 -->
    <div class="btn-row">
      <button id="btnStartCollect" class="btn primary full">수집 시작</button>
      <button id="btnStopCollect" class="btn danger" disabled>중지</button>
      <button id="btnExportCSV" class="btn ghost">CSV</button>
    </div>

    <!-- 진행 상황 -->
    <div class="progress-card" id="progressCard">
      <div class="progress-header">
        <span id="progressLabel">대기 중</span>
        <span id="progressCount" class="progress-count">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-detail" id="progressDetail"></div>
    </div>

    <!-- 수집 목록 -->
    <div class="list-header">
      <span id="collectedCount">수집된 게시물 0개</span>
    </div>
    <div class="post-list" id="collectedList"></div>

  </section>

  <!-- ── AI 생성 탭 ── -->
  <section class="panel" id="tab-generate">

    <div class="field">
      <label>기반 게시물</label>
      <select id="sourcePost">
        <option value="">전체 분석 (패턴 종합)</option>
      </select>
    </div>

    <div class="field">
      <label>AI 모델</label>
      <select id="aiModel">
        <option value="claude">Claude (Anthropic)</option>
        <option value="gpt4">GPT-4o (OpenAI)</option>
      </select>
    </div>

    <div class="field">
      <label>추가 지시 <span class="hint">선택사항</span></label>
      <textarea id="userPrompt" rows="2" placeholder="예: 공감 가는 톤으로, 마지막에 질문 추가"></textarea>
    </div>

    <button id="btnGenerate" class="btn primary full">AI로 글 생성</button>

    <div class="loading-bar hidden" id="generateLoading">
      <div class="loading-inner"></div>
    </div>

    <div class="generated-box hidden" id="generatedSection">
      <label>생성된 글</label>
      <textarea id="generatedText" rows="6"></textarea>
      <div class="btn-row mt8">
        <button id="btnRegenerate" class="btn ghost">다시 생성</button>
        <button id="btnSendToQueue" class="btn primary">큐에 추가 →</button>
      </div>
    </div>

  </section>

  <!-- ── 발행 큐 탭 ── -->
  <section class="panel" id="tab-queue">

    <div class="compose-card">
      <div class="field">
        <label>게시글</label>
        <textarea id="composeText" rows="4" placeholder="발행할 내용을 입력하세요..."></textarea>
      </div>

      <div class="field">
        <label>이미지 첨부</label>
        <div class="image-btns">
          <button id="btnImageUpload" class="btn ghost sm">📁 업로드</button>
          <button id="btnImageViral" class="btn ghost sm">🔗 바이럴</button>
          <button id="btnImageDalle" class="btn ghost sm">🎨 DALL-E</button>
        </div>
        <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none" />
      </div>

      <div id="imagePreviewList" class="preview-row"></div>

      <!-- DALL-E 패널 -->
      <div id="dallePanel" class="dalle-panel hidden">
        <input type="text" id="dallePrompt" placeholder="이미지 설명 (영어 권장)" />
        <select id="dalleSize">
          <option value="1024x1024">정사각형</option>
          <option value="1024x1792">세로형</option>
          <option value="1792x1024">가로형</option>
        </select>
        <button id="btnGenerateImage" class="btn primary sm">생성</button>
        <div class="loading-bar hidden" id="dalleLoading"><div class="loading-inner"></div></div>
      </div>

      <div class="schedule-row">
        <input type="datetime-local" id="scheduleTime" />
        <button id="btnAddQueue" class="btn ghost sm">예약</button>
        <button id="btnPublishNow" class="btn primary sm">즉시 발행</button>
      </div>
    </div>

    <div class="list-header">
      <span>예약 목록</span>
      <button id="btnClearQueue" class="btn danger sm">전체 삭제</button>
    </div>
    <div class="queue-list" id="queueList"></div>

  </section>

  <!-- ── 설정 탭 ── -->
  <section class="panel" id="tab-settings">

    <div class="field">
      <label>Anthropic API 키 <span class="hint">Claude</span></label>
      <input type="password" id="claudeApiKey" placeholder="sk-ant-..." />
    </div>
    <div class="field">
      <label>OpenAI API 키 <span class="hint">GPT-4 / DALL-E</span></label>
      <input type="password" id="openaiApiKey" placeholder="sk-..." />
    </div>
    <div class="field">
      <label>기본 AI 모델</label>
      <select id="defaultModel">
        <option value="claude">Claude</option>
        <option value="gpt4">GPT-4o</option>
      </select>
    </div>
    <div class="field">
      <label>발행 간 딜레이 (초)</label>
      <input type="number" id="publishDelay" value="30" min="10" />
    </div>

    <button id="btnSaveSettings" class="btn primary full">저장</button>
    <div class="toast hidden" id="settingsMsg"></div>

  </section>

</div>
<script src="popup.js"></script>
</body>
</html>
